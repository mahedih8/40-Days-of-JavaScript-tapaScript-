<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>BMI Calculator</title>
</head>
<body>  

  <div class="content">
    <div class="child_content1">
      <h2>BMI Calculator.</h2>
    </div>
    <div class="child_content2">
      <form action="" id="form">
        <label for="height">Enter Your Height</label>
        <input type="number" id="height" placeholder="cm">
        <label for="weight">Enter Your Weight</label>
        <input type="number" id="weight" placeholder="kg">
      </form>
    </div>
    <div class="child_content3">
      <button>Calculate</button>
      <h3>Result:<span id="result">00</span></h3>
      <h4 class="author_text">Md. Mahedi Hasan</h4>
    </div>
  </div>



 <script src="scripts.js"></script>
</body>
</html>
